<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            background-color: lightgray;
            height: 80px;
            width: 250px;

            border: 10px solid aqua;
            border-radius: 10px;

            padding: 10px;

            margin: 10px;

            outline-width: 5px;
            outline-style: dashed;
            outline-color: blueviolet;
        }

        a {
            border-width: 1px;
            border-style: solid;
            border-color: red;
            padding-top: 2px;
            padding-right: 2px;
            padding-bottom: 2px;
            padding-left: 2px;
        }

    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level (ocupa toda a linha), mas os <a href="#"> links são exemplos de caixas inline-level (ocupa apenas o espaço necessário dentro da linha)</a>. Vamos ver como tudo isso funciona!</p>











</body>
</html>
